name: ci

on:
  push:
    branches: [trunk]
    paths-ignore: ['docs/**', '**.md', LICENSE, .hut.scfg, .builds/**, .build.yml]
  pull_request:
    paths-ignore: ['docs/**', '**.md', LICENSE, .hut.scfg, .builds/**, .build.yml]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lisp: [sbcl, ecl]
    steps:
      - uses: actions/checkout@v5

      - name: Install Lisp
        run: sudo apt-get update && sudo apt-get install -y sbcl ${{ matrix.lisp }}

      - name: Install Quicklisp
        run: |
          curl -sSfLO https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --no-userinit --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)'
          cp -R "$GITHUB_WORKSPACE" ~/quicklisp/local-projects/meow

      - name: Install dependencies outside Quicklisp
        run: |
          git clone --depth 1 https://github.com/takeiteasy/trivial-high-precision-timer \
              ~/quicklisp/local-projects/trivial-high-precision-timer
          git clone --depth 1 https://github.com/takeiteasy/trivial-wait \
              ~/quicklisp/local-projects/trivial-wait

      - name: Test
        run: tests/test.sh ${{ matrix.lisp }}
